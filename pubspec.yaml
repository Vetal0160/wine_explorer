name: wine_explorer
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  cached_network_image: ^3.3.1
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.5.5
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.2
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/splash.png

# Иконка: python tool/make_icon.py, затем dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_background: assets/icon/icon_background.png
  # Отступ уже заложен в icon_foreground.png
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  min_sdk_android: 21

# Заставка при запуске: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#58111A"
  image: assets/icon/splash.png
  android_12:
    color: "#58111A"
    image: assets/icon/icon_foreground.png
  web: false
